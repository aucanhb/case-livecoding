apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-worker-config
  namespace: interview
data:
  REDIS_URL: redis://redis.interview.svc.cluster.local:6379/0
  QUEUE_NAME: notifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: interview
  labels:
    app.kubernetes.io/name: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "notification-worker starting..."
              if [ -z "$REDIS_URL" ]; then
                echo "FATAL: REDIS_URL environment variable is not set" >&2
                exit 1
              fi
              echo "Using queue '${QUEUE_NAME}' on ${REDIS_URL}"
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
